name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/web.yml'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build first so that fumadocs-mdx seeds .source/ before any
      # standalone tsc invocation. next build also type-checks, so this
      # step subsumes the previous separate `pnpm typecheck`.
      - run: pnpm build
      - run: pnpm lint
