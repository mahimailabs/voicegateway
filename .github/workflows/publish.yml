name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    # Only run on releases starting with 'v'
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: src/dashboard/frontend/package-lock.json

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    # The daemon ships the prebuilt React bundle inside the wheel
    # (see pyproject.toml force-include) so pip install does not need
    # Node. Build it here before python -m build packs the wheel.
    - name: Build dashboard frontend
      working-directory: src/dashboard/frontend
      run: |
        npm ci
        npm run build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/
