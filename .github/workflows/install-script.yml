name: install.sh container matrix

# Verifies install.sh runs cleanly inside fresh Ubuntu LTS, Debian, and
# Fedora containers. Each distro runs as a parallel matrix job so a
# regression in one image does not mask passes elsewhere.
#
# Runs only when install.sh or the test runner changes. Manual dispatch
# is wired up for ad-hoc verification.
#
# Nightly schedule (06:00 UTC) catches base-image drift: Ubuntu 24.04,
# Debian 12, and Fedora 40 ship security and packaging updates that
# can break pipx availability or the Python 3.11+ floor without our
# code changing. The nightly run trips a regression before users hit
# it on a fresh install.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'tools/tests/_pipx_stub.sh'
      - 'tools/tests/_uv_stub.sh'
      - 'tools/tests/test_install_script.sh'
      - '.github/workflows/install-script.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  install-script:
    name: install.sh / ${{ matrix.image }} / ${{ matrix.installer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:40
        installer: [pipx, uv]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker is available
        run: |
          docker --version
          docker info >/dev/null

      - name: Pre-pull base image
        # Pulling out-of-band gives clearer failure attribution if the
        # registry is flaking and avoids the test timing out on a slow
        # cold pull. Matrix values are funneled through env so the run
        # block never interpolates ${{ ... }} directly into the shell.
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"

      - name: Run install.sh inside container
        env:
          IMAGE: ${{ matrix.image }}
          INSTALLER: ${{ matrix.installer }}
        run: bash tools/tests/test_install_script.sh --image "$IMAGE" --installer "$INSTALLER"
