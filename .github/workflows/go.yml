name: Go

# The voicegateway binary: lint, tests against real dependencies (testcontainers), and the
# six-service stack started from deploy/compose.yaml exactly as a teammate would (phase02 spec).

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - 'tools/scripts/dev-env.sh'
      - 'migrations/**'
      - '.github/workflows/go.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'deploy/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make go-lint
      - run: make go-test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make up
      - run: curl --fail --silent --show-error http://localhost:8080/healthz
      - run: make preflight
      # The URL is a placeholder with no LiveKit behind it, so the LiveKit check is skipped; the
      # check itself is tested against livekit-server --dev in the Go tests.
      - name: Add a project, then refuse its LiveKit key a second time
        env:
          SKIP_VERIFY: "1"
          LIVEKIT_URL: wss://ci.example.livekit.cloud
          LIVEKIT_API_KEY: APIci
          LIVEKIT_API_SECRET: ci-only-secret
        run: |
          make project-add NAME="CI project" | tee add.log
          grep -q "added project default/ci-project" add.log
          if make project-add NAME="CI copy" > dup.log 2>&1; then echo "duplicate LiveKit key was accepted"; exit 1; fi
          grep -q "already used by another project" dup.log
          ! grep -q "ci-only-secret" add.log dup.log
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env logs --no-color
      - if: always()
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env down --volumes
