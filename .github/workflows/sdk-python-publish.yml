name: Publish Python SDK

# Publishes sdk/python (PyPI name voicegateway) when a sdk-python-v* tag is pushed, for example
# sdk-python-v1.0.0rc6. It uses the repository's PYPI_API_TOKEN secret in the `pypi` environment, as
# the retired publish.yml did (removed in #408). sdk-python.yml checks every change to the SDK; this
# runs the same checks once more on the tagged source, checks the tag names the package's version, and
# publishes.

on:
  push:
    tags:
      - 'sdk-python-v*'

concurrency:
  group: sdk-python-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.8.15'

      - name: The tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#sdk-python-v}" != "$version" ]; then
            echo "tag $TAG does not match the package version $version" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          uv lock --check
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked mypy
          uv run --locked pytest

      - name: Build
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-python-dist
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/voicegateway/
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
