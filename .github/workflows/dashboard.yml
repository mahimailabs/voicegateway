name: Dashboard

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'docs/api/**'
      - 'Makefile'
      - 'redocly.yaml'
      - '.gitignore'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: make api-check
      - run: make dashboard-test
      - run: make dashboard-lint
      - run: npm --prefix dashboard run build
      - run: cd dashboard && npx --no-install playwright install --with-deps chromium
      - run: make dashboard-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-failures
          path: dashboard/node_modules/.cache/playwright/
          include-hidden-files: true
          retention-days: 7
