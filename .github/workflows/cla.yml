name: CLA

# Contributors sign CLA.md once, by commenting on a pull request. The signature
# is what lets the project, which is AGPL-3.0, also be licensed for the hosted
# edition. No checkout: pull_request_target runs with write access, so the PR's
# code is never fetched or executed here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/mahimailabs/voicegateway/blob/main/CLA.md
          # Kept off main so recording a signature never needs to push past
          # branch protection.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: mahimairaja,*[bot]
