name: Notify voicegateway-web on docs change

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'install.sh'
      - '.github/workflows/docs.yml'

jobs:
  rebuild-web:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger voicegateway-web rebuild
        env:
          HOOK_URL: ${{ secrets.VOICEGATEWAY_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VOICEGATEWAY_WEB_DEPLOY_HOOK secret not set; skipping rebuild trigger."
            exit 0
          fi
          curl -fSs -X POST "$HOOK_URL"
          echo "voicegateway-web rebuild triggered."
