name: Bug report
description: Something VoiceGateway records, prices or shows is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest agent or command that shows it. Redact API keys.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: The VoiceGateway image tag, your LiveKit server version and your LiveKit Agents version.
    validations:
      required: true
