              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage/ttsCharacters, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
              x-unit: characters
            sttSeconds:
              type: [ number, "null" ]
              x-null-reason: Session usage not reported; never sum missing values as zero.
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage/sttSeconds, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
              x-unit: seconds
            note:
