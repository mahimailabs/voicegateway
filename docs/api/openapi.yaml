          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/participantCount, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
