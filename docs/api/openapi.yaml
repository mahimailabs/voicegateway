  /api/v1/org/{orgId}/project/{projectId}/recordings/{recordingId}:
    get:
      operationId: getRecordingMedia
      summary: Read retained opt-in recording audio
      tags:
        - Console reads
      x-access:
        principal: organisation_member
        minimumRole: Viewer
        projectIsolation: required
        browserSessionTransport: not_selected
        scope: project
      description: "Requires authenticated organisation membership and permission to read the named project. Browser session transport is intentionally not selected by #321. Credential absence is 401, denied membership is 403, cross-project resource ids are not_found. Server-side LiveKit credentials must never reach the browser. Resolve the recording id server-side only after project authorisation. Do not fetch an arbitrary request URL. Enforce retention and recording opt-in; never synthesise media for a call without an observed recording."
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ProjectId"
        - name: recordingId
          in: path
          required: true
          description: Opaque recording identifier from authorised call or room metadata, within the selected project.
          schema:
            type: string
            minLength: 1
        - name: Range
          in: header
          description: Optional HTTP byte range used by the browser audio player. Standard byte-range and conditional HTTP semantics apply.
          schema:
            type: string
      responses:
        "200":
          description: Authorised recording bytes, with private cache policy. No retained recording returns 404; upstream storage failure returns 503.
          headers:
            Accept-Ranges: &a2
              description: Byte range support.
              schema:
                type: string
                const: bytes
            Cache-Control: &a3
              description: Private response; do not cache recordings in shared caches.
              schema:
                type: string
          content:
            audio/ogg: &a1
              schema:
                type: string
                format: binary
            audio/wav: *a1
            application/octet-stream: *a1
        "206":
          description: Requested byte range, using standard HTTP partial content.
          headers:
            Accept-Ranges: *a2
            Cache-Control: *a3
            Content-Range:
              description: Returned byte interval and complete object size.
              schema:
                type: string
          content:
            application/octet-stream: *a1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested byte range cannot be served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"
components:
  schemas:
    Call:
      type: object
      additionalProperties: false
      properties:
        room:
          type: string
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/room, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
