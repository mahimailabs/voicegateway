components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: vg_session
      description: The console's session cookie, set when you sign in. Every operation accepts it, at the role the operation names.
    projectKey:
      type: http
      scheme: bearer
      bearerFormat: vgk_<keyId>_<secret>
      description: A project API key, which an Admin creates in the console. It reads its own project as a Viewer and is refused writes, other projects and organisation operations.
    instanceToken:
      type: http
      scheme: bearer
      description: VOICEGATEWAY_INSTANCE_TOKEN, for an operator's program (phase 06e). It calls the instance API and nothing else; nothing else calls the instance API.
  schemas:
    Call:
      type: object
      additionalProperties: false
      properties:
        room:
          type: string
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/room, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
        roomSid:
          type: [ string, "null" ]
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/roomSid, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
          x-null-reason: No real LiveKit Room SID was received. Never treat a preview/console placeholder as a native Room SID.
        startedAt:
          type: string
          format: date-time
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/startedAt, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
        endedAt:
          type: [ string, "null" ]
          format: date-time
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/endedAt, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
          x-null-reason: Null while open or while the end is not known; last observation is not an observed end.
        durationSeconds:
          type: [ number, "null" ]
          x-unit: seconds
          x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
          x-source: { kind: computed, file: dashboard/src/mocks/calls.json, pointer: /calls/0/durationSeconds, detail: "Captured conversation duration in seconds, derived from the retained time window; null without enough timing evidence." }
        participantCount:
          type: [ integer, "null" ]
          x-unit: count
          x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
          x-source: { kind: webhook, file: dashboard/src/mocks/calls.json, pointer: /calls/0/participantCount, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
        endReason:
          type: [ string, "null" ]
          x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
          x-source: { kind: webhook, file: dashboard/src/mocks/capture-session.json, pointer: /call/endReason, detail: "Normalised room/participant webhook capture in calls.json; other session/console captures may use agent metadata or capture annotations. No Room SID, end event or count may be inferred solely from a name." }
        spans:
          type: [ array, "null" ]
          items:
            $ref: "#/components/schemas/Span"
          x-source: { kind: agent_upload, file: dashboard/src/mocks/calls.json, pointer: /calls/1/spans, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
          x-null-reason: No spans were received for this call; an empty array means an observed empty span set.
        turns:
          type: [ array, "null" ]
          items:
            $ref: "#/components/schemas/Turn"
          x-source: { kind: agent_upload, file: dashboard/src/mocks/calls.json, pointer: /calls/1/turns, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
          x-null-reason: No turn data was received; realtime may report transcripts without stage metrics.
        events:
          type: [ array, "null" ]
          items:
            oneOf:
              - $ref: "#/components/schemas/StateEvent"
              - $ref: "#/components/schemas/TranscriptEvent"
              - $ref: "#/components/schemas/EndOfTurnEvent"
              - $ref: "#/components/schemas/OverlapEvent"
              - $ref: "#/components/schemas/ItemEvent"
          x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/events, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
          x-null-reason: Null when this source did not provide events. An empty collection is an observed empty result, not missing data.
        usage:
          type: [ object, "null" ]
          additionalProperties: false
          properties:
            llmInputTokens:
              type: [ integer, "null" ]
              x-unit: tokens
              x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage/llmInputTokens, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
            llmOutputTokens:
              type: [ integer, "null" ]
