openapi: 3.1.1
info:
  title: VoiceGateway console read contract
  version: 1.0.0-draft
  description: "Issue #321 draft. Read models normalise captured LiveKit evidence; native LiveKit clients/protocol messages remain the source, never reimplemented. No Go implementation, generated TypeScript or MSW in this PR. Browser authentication transport is deliberately unresolved; x-access states mandatory authorisation policy, not anonymous access. See coverage.md and upstream-sources.md for provenance and missing-data rules."
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same-origin VoiceGateway web role
tags:
  - name: Console reads
    description: Authorised project-scoped console data.
paths:
  /api/v1/org/{orgId}/project/{projectId}/calls:
    get:
      operationId: listCalls
      summary: List captured conversations in a project
      tags:
        - Console reads
      x-access:
        principal: organisation_member
        minimumRole: Viewer
        projectIsolation: required
        browserSessionTransport: not_selected
        scope: project
      description: "Requires authenticated organisation membership and permission to read the named project. Browser session transport is intentionally not selected by #321. Credential absence is 401, denied membership is 403, cross-project resource ids are not_found. Server-side LiveKit credentials must never reach the browser."
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          description: Page size, 1 to 100; omitted means 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: Opaque nextCursor from prior response.
          schema:
            type: string
        - name: snapshot
          in: query
          description: Snapshot from prior response; required with cursor.
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive UTC start boundary applied to call startedAt.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC end boundary applied to call startedAt.
          schema:
            type: string
            format: date-time
        - name: room
          in: query
          description: Exact room-name filter; may return multiple conversations.
          schema:
            type: string
      responses:
        "200":
          description: Authorised read result. Null means unreported, never zero. Source-specific coverage limits remain visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"
  /api/v1/org/{orgId}/project/{projectId}/calls/{callId}:
    get:
      operationId: getCall
      summary: Read one conversation and its reported turns, events, spans and recording
      tags:
        - Console reads
      x-access:
        principal: organisation_member
        minimumRole: Viewer
        projectIsolation: required
        browserSessionTransport: not_selected
        scope: project
      description: "Requires authenticated organisation membership and permission to read the named project. Browser session transport is intentionally not selected by #321. Credential absence is 401, denied membership is 403, cross-project resource ids are not_found. Server-side LiveKit credentials must never reach the browser."
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ProjectId"
        - name: callId
          in: path
          required: true
          description: Canonical conversation id, not room name.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Authorised read result. Null means unreported, never zero. Source-specific coverage limits remain visible.
          content:
