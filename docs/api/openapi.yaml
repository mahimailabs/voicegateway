  /api/v1/instance/organisations/{orgId}/invitations:
    post:
      operationId: createOrganisationInvitation
      summary: Invite someone to an organisation, with no inviting user
      tags:
        - Instance
      security:
        - instanceToken: []
      x-access:
        principal: instance
        minimumRole: Instance
        scope: instance
      description: For the instance token only (phase 06e). Makes a phase 06d invitation with no inviting user. The Idempotency-Key header is required; a repeat with the same key answers 200 with the first invitation, link null, nothing revoked and nothing sent. The same key with another email or role is invalid_request. A repeat that arrives while the first call is still sending waits for that send's outcome. A new key for an email with an open invitation revokes the open link and sends or returns a new one, which is how a caller retries a failed send; resend only on emailed false, never on null. With SMTP set, link is always null and emailed says whether the send succeeded, or is null when SMTP acceptance is uncertain or a prior send's outcome was lost. An email whose account is already a member is 409 already_member.
      parameters:
        - $ref: "#/components/parameters/InstanceOrganisationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "200":
          description: The key made this invitation before; nothing was revoked or sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInvitation"
        "201":
          description: This call made the invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInvitation"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"
  /api/v1/instance/organisations/{orgId}/usage:
    get:
      operationId: getOrganisationUsage
      summary: Read an organisation's profiled call time in a period
      tags:
        - Instance
      security:
        - instanceToken: []
      x-access:
        principal: instance
        minimumRole: Instance
        scope: instance
      description: For the instance token only (phase 06e, decision 0029). A call counts in the period its end falls in, when its start is known; an observed call ends at its end, an inferred one at its last activity, a lower bound. Exact durations are summed, then rounded down to whole seconds once. Calls that started in the period with no end yet are counted in unendedCalls and never summed. Closed calls with a null or negative duration are excluded from the measured totals and counted as unmeasuredCalls by start period. Inferred durations are separately summed in inferredCallSeconds. Turning seconds into billed minutes is the caller's job. A missing or bad from or to, to not after from, or a span over 62 days is invalid_request; an unknown organisation is not_found.
      parameters:
        - $ref: "#/components/parameters/InstanceOrganisationId"
        - name: from
          in: query
          required: true
          description: Inclusive start of the period, an RFC 3339 instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive end of the period, an RFC 3339 instant, after from and at most 62 days later.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The organisation's call time in the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"
  /api/v1/instance/organisations/{orgId}/entitlement:
    get:
      operationId: getOrganisationEntitlement
      summary: Read the organisation allowance and measured usage
      tags:
      - Instance
      security:
      - instanceToken: []
      x-access:
        principal: instance
        minimumRole: Instance
        scope: instance
      description: Hosted entitlement. Explicit [from,to) period; closed-call seconds
        survive telemetry deletion. Revision is monotonic per organisation; conflicting
        or stale updates return 409. Open calls can overshoot the cap. No automatic
        overages. Disabled on self-hosted installs.
      parameters:
      - $ref: '#/components/parameters/InstanceOrganisationId'
      responses:
        '200':
          description: Allowance, durable usage and ingestion status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationEntitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
    put:
      operationId: putOrganisationEntitlement
      summary: Set the organisation allowance and measured usage
      tags:
      - Instance
      security:
      - instanceToken: []
      x-access:
        principal: instance
        minimumRole: Instance
        scope: instance
      description: Hosted entitlement. Explicit [from,to) period; closed-call seconds
        survive telemetry deletion. Revision is monotonic per organisation; conflicting
        or stale updates return 409. Open calls can overshoot the cap. No automatic
        overages. Disabled on self-hosted installs.
      parameters:
      - $ref: '#/components/parameters/InstanceOrganisationId'
      responses:
        '200':
          description: Allowance, durable usage and ingestion status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationEntitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
        '409':
          description: Stale revision or conflicting replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
