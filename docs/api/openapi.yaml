openapi: 3.1.1
info:
  title: VoiceGateway API
  version: 1.0.0
  description: |-
    The API behind the VoiceGateway console, for an organisation's LiveKit projects: calls and their
    turns, issues, alerts, and what VoiceGateway reads of each LiveKit layer (media server, agent
    workers, SIP, egress and ingress), plus its members and their roles.

    Sign in to the console first: requests use its session cookie, and each operation names the
    lowest organisation role it needs. Scripts and agents send a project API key instead, as
    `Authorization: Bearer vgk_...`: an Admin creates it in the console, and it reads that one
    project's data and changes nothing. Project paths take the organisation and project ids shown in
    the console's address bar. Times are RFC 3339; a value no source reported is null, never zero.
  license:
    name: MIT
    identifier: MIT
security:
  - consoleSession: []
servers:
  - url: /
    description: Same-origin VoiceGateway web role
tags:
  - name: Console reads
    description: Authorised project-scoped console data.
  - name: Console writes
    description: Organisation changes a signed-in Admin makes (phase 06b).
  - name: Instance
    description: The instance API for an operator's program, behind VOICEGATEWAY_INSTANCE_TOKEN (phase 06e, Enterprise code under ee/).
paths:
  /api/v1/org/{orgId}/project/{projectId}/calls:
    get:
      operationId: listCalls
      security:
        - consoleSession: []
        - projectKey: []
      summary: List call summaries in a project, filtered and sorted on the server
      tags:
        - Console reads
      x-access:
        principal: organisation_member
        minimumRole: Viewer
        projectIsolation: required
        browserSessionTransport: session_cookie
        scope: project
      x-embed-access:
        credential: embed_token
        widgets:
          - calls
        projectIsolation: required
        originAllowList: required
        readOnly: true
      description: "Requires authenticated organisation membership and permission to read the named project. A browser signs in with the session cookie (decision 0027); the role gate admits the minimumRole and above. Credential absence is 401, denied membership is 403, cross-project resource ids are not_found. Server-side LiveKit credentials must never reach the browser."
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          description: Page size, 1 to 100; omitted means 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: Opaque nextCursor from prior response.
          schema:
            type: string
        - name: snapshot
          in: query
          description: Snapshot from prior response; required with cursor. It expires a day after the first page; an expired, unknown or malformed snapshot, or one sent for another project or other filters, is 400 invalid_request.
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive UTC start boundary applied to call startedAt.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC end boundary applied to call startedAt.
          schema:
            type: string
            format: date-time
        - name: room
          in: query
          description: Exact room-name filter; may return multiple conversations.
          schema:
            type: string
        - name: channel
          in: query
          description: How the call reached the agent. Repeat to match any listed channel.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [ phone, web, console, local, unknown ]
        - name: issues
          in: query
          description: "Highest finding severity on the call: high, medium, or none for calls with neither. Repeat to match any."
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [ high, medium, none ]
        - name: answerMsMin
          in: query
          description: Inclusive lower bound on the call's median answer time in milliseconds. Calls with an unknown answer time never match a bound.
          schema:
            type: number
            minimum: 0
        - name: answerMsMax
          in: query
          description: Inclusive upper bound on the call's median answer time in milliseconds. Calls with an unknown answer time never match a bound.
          schema:
            type: number
            minimum: 0
        - name: durationSecondsMin
          in: query
          description: Inclusive lower bound on call length in seconds. Unknown lengths never match a bound.
          schema:
            type: number
            minimum: 0
        - name: durationSecondsMax
          in: query
          description: Inclusive upper bound on call length in seconds. Unknown lengths never match a bound.
          schema:
            type: number
            minimum: 0
        - name: turnsMin
          in: query
          description: Inclusive lower bound on agent turns. Unknown counts never match a bound.
          schema:
            type: integer
            minimum: 0
        - name: turnsMax
          in: query
          description: Inclusive upper bound on agent turns. Unknown counts never match a bound.
          schema:
            type: integer
            minimum: 0
        - name: unknown
          in: query
          description: Only calls where every listed value is unknown. This is how the console's "is empty" filter reaches the server; an unknown value is never matched as zero.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [ answerMs, durationSeconds, turnCount ]
        - name: tag
          in: query
          description: User tag. Repeat to match calls carrying any listed tag.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              minLength: 1
        - name: recorded
          in: query
          description: true for calls with a retained recording, false for calls without one. Omitted means both.
          schema:
            type: boolean
        - name: archived
          in: query
          description: true for archived calls only, false for unarchived only. Omitted means both.
          schema:
            type: boolean
        - name: sort
          in: query
          description: "Sort key, applied on the server before paging. Unknown values sort after known values in both orders; ties break by id. A cursor is bound to the filters, sort and order it was issued for: changing any of them with a cursor is invalid_request."
          schema:
            type: string
            enum: [ startedAt, durationSeconds, turnCount, answerMs, issues ]
            default: startedAt
        - name: order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [ asc, desc ]
            default: desc
      responses:
        "200":
          description: Authorised read result. Null means unreported, never zero. Source-specific coverage limits remain visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"
