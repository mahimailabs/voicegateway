                  x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/peaks/agent, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
                  description: Amplitude bars for the agent track, only when waveform extraction and attribution are available.
              required: [ caller, agent ]
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/peaks, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
              description: Normalised amplitude bars for each attributed speaker track, not text-derived estimates. Empty bars in captures do not establish silence.
              x-null-reason: No waveform extraction/speaker attribution was retained. Missing amplitude is not zero amplitude.
            id:
              type: string
              description: Opaque project-scoped identifier for the retained recording media. A recording id does not grant access.
              x-source: &a4 { kind: computed, file: docs/api/coverage.md, pointer: null, detail: "Server read-resource identifier for retained opt-in recording media. Captures store local URLs, not production recording ids; no id is guessed from audio or room name." }
            clockId:
