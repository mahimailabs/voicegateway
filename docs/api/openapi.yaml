  responses:
    BadRequest:
      description: invalid_request; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: unauthenticated; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: forbidden; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: not_found; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: last_admin, the change would leave the organisation without an admin; already_member, the invited email's account is a member already; member_of_other_organisations, a reset's member belongs to an organisation the requester does not administer; project_exists, the organisation already has a project with the new name's id; livekit_key_in_use, another project on this server uses that LiveKit API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: internal_error; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceUnavailable:
      description: source_unavailable; never return an empty success result for this failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    InstanceOrganisationId:
      name: orgId
      in: path
      required: true
      description: The organisation's id, chosen by the caller; any other shape is invalid_request.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 200 printable characters; a Cloud control plane sends its checkout session id. A repeat with the same key returns the first invitation.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    KeyId:
      name: keyId
      in: path
      required: true
      description: A project key's id, the 12 characters after vgk_; one from another project is not_found, and any other value is invalid_request.
      schema:
        type: string
        pattern: "^[a-z2-7]{12}$"
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: An invitation's id; one from another organisation, or any other value, is not_found.
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      description: A member's user id; one outside the named organisation is not_found.
      schema:
        type: string
        minLength: 1
    OrganisationId:
      name: orgId
      in: path
      required: true
      description: Authorised orgId; the server must verify organisation/project ownership before any read.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Authorised projectId; the server must verify organisation/project ownership before any read.
      schema:
        type: string
        minLength: 1
