              x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage/llmOutputTokens, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
            ttsCharacters:
              type: [ number, "null" ]
