              x-source: { kind: computed, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage/note, detail: Capture annotation describing the recorded source and its limits; not a LiveKit API response field. }
          required: [ llmInputTokens, llmOutputTokens, ttsCharacters, sttSeconds, note ]
          x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/usage, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
          x-null-reason: Null when this source did not provide usage. An empty collection is an observed empty result, not missing data.
        recording:
          type: [ object, "null" ]
          additionalProperties: false
          properties:
            url:
              type: string
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/url, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
              description: Authorised playback resource URL for this recording, normally the same-origin /api/v1/org/{orgId}/project/{projectId}/recordings/{recordingId}. Captured local audio paths are fixture evidence only. Never return storage credentials or accept a caller-supplied storage URL.
            duration:
              type: [ number, "null" ]
              x-unit: seconds
              x-null-reason: The capture or source did not report this value. Preserve null rather than a protobuf default or guessed zero.
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/duration, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
            segments:
              type: [ array, "null" ]
              items:
                $ref: "#/components/schemas/RecordingSegment"
              x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/segments, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
              x-null-reason: No recording-aligned speaker segments were retained. Captured placeholder arrays are not evidence of observed silence.
            peaks:
              type: [ object, "null" ]
              additionalProperties: false
              properties:
                caller:
                  type: array
                  items:
                    type: number
                    minimum: 0
                    maximum: 1
                    x-unit: normalised_amplitude
                  x-source: { kind: agent_upload, file: dashboard/src/mocks/capture-session.json, pointer: /call/recording/peaks/caller, detail: Normalised captured call data; consult fixture source note and upstream-source inventory for conversions }
                  description: Amplitude bars for the caller track, only when waveform extraction and attribution are available.
                agent:
