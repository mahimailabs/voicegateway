<svg width="1100" height="258" viewBox="0 0 1100 258" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoiceGateway — voice AI cost and quality observability, self-hosted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1417"/>
      <stop offset="0.55" stop-color="#0C1B20"/>
      <stop offset="1" stop-color="#0E2329"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 -10) scale(300)">
      <stop offset="0" stop-color="#14B8C4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14B8C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 258) scale(260)">
      <stop offset="0" stop-color="#1F96AA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1F96AA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="258" fill="url(#bg)"/>
  <rect width="1100" height="258" fill="url(#glowA)"/>
  <rect width="1100" height="258" fill="url(#glowB)"/>

  <!-- hero gauge -->
  <svg x="820" y="61" width="212" height="135" viewBox="104 176 472 300" fill="none">
    <path d="M140 420 A200 200 0 0 1 540 420" stroke="#ffffff" stroke-opacity="0.10" stroke-width="32" stroke-linecap="round"/>
    <path d="M140 420 A200 200 0 0 1 283 198" stroke="#22C1D0" stroke-width="32" stroke-linecap="round"/>
    <path d="M140 420 A200 200 0 0 1 220 248" stroke="#7FE3EC" stroke-width="32" stroke-linecap="round" opacity="0.35"/>
    <line x1="340" y1="420" x2="240" y2="210" stroke="#BFF4FA" stroke-width="14" stroke-linecap="round"/>
    <circle cx="340" cy="420" r="28" fill="#22C1D0"/>
    <circle cx="340" cy="420" r="14" fill="#0E2329"/>
    <g fill="#22C1D0">
      <circle cx="160" cy="430" r="10" opacity="0.4"/>
      <circle cx="200" cy="310" r="10" opacity="0.5"/>
      <circle cx="280" cy="220" r="10" opacity="0.7"/>
      <circle cx="400" cy="210" r="10" opacity="0.8"/>
      <circle cx="490" cy="285" r="10" opacity="0.5"/>
      <circle cx="530" cy="400" r="10" opacity="0.4"/>
    </g>
  </svg>

  <!-- eyebrow -->
  <text x="56" y="62" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7FE3EC">OPEN SOURCE · SELF-HOSTED</text>

  <!-- lockup: mark + wordmark -->
  <svg x="56" y="80" width="40" height="40" viewBox="104 176 472 300" fill="none">
    <path d="M140 420 A200 200 0 0 1 540 420" stroke="#ffffff" stroke-opacity="0.14" stroke-width="44" stroke-linecap="round"/>
    <path d="M140 420 A200 200 0 0 1 283 198" stroke="#22C1D0" stroke-width="44" stroke-linecap="round"/>
    <line x1="340" y1="420" x2="238" y2="206" stroke="#BFF4FA" stroke-width="22" stroke-linecap="round"/>
    <circle cx="340" cy="420" r="34" fill="#22C1D0"/>
    <circle cx="340" cy="420" r="16" fill="#0E2329"/>
  </svg>
  <text x="108" y="112" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
    <tspan fill="#ffffff">Voice</tspan><tspan fill="#22C1D0">Gateway</tspan>
  </text>

  <!-- tagline -->
  <text x="56" y="156" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#A6BEC4">Voice AI cost and quality observability. Self-hosted, on your keys.</text>

  <!-- footer chips -->
  <text x="56" y="196" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5FA7B0">LIVEKIT AGENTS · ANY PROVIDERS · TRANSPARENT · SELF HOSTING</text>
</svg>
