<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#091221"/>
      <stop offset="1" stop-color="#0e2034"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 70) scale(360)">
      <stop offset="0" stop-color="#3EA8FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3EA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 280) scale(340)">
      <stop offset="0" stop-color="#EB5F36" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#EB5F36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="costline" x1="80" y1="0" x2="918" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EA8FF"/>
      <stop offset="1" stop-color="#EB5F36"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EA8FF"/>
      <stop offset="1" stop-color="#EB5F36"/>
    </linearGradient>
    <linearGradient id="bars" x1="1046" y1="0" x2="1112" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="1" stop-color="#ff9d7a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#glowBlue)"/>
  <rect width="1280" height="300" fill="url(#glowOrange)"/>

  <!-- voice orb: the call -->
  <circle cx="1080" cy="150" r="104" stroke="#EB5F36" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="1080" cy="150" r="78" stroke="#3EA8FF" stroke-opacity="0.24" stroke-width="2"/>
  <circle cx="1080" cy="150" r="52" fill="url(#orb)" fill-opacity="0.92"/>
  <g fill="url(#bars)">
    <rect x="1046" y="139" width="7" height="22" rx="3.5"/>
    <rect x="1060" y="128" width="7" height="44" rx="3.5"/>
    <rect x="1074" y="118" width="7" height="64" rx="3.5"/>
    <rect x="1088" y="131" width="7" height="38" rx="3.5"/>
    <rect x="1102" y="140" width="7" height="20" rx="3.5"/>
  </g>

  <!-- cost line: spend climbing through the call, rising toward the live orb -->
  <path d="M80 242 H200 V228 H330 V214 H470 V200 H620 V186 H780 V172 H900"
        stroke="url(#costline)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="330" cy="214" r="3.4" fill="#7cc0ff"/>
  <circle cx="620" cy="200" r="3.4" fill="#a9b9d9"/>
  <circle cx="780" cy="186" r="3.4" fill="#ff9d7a"/>
  <circle cx="918" cy="172" r="12" fill="#EB5F36"/>
  <text x="918" y="177" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">$</text>

  <text x="80" y="128" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-2" fill="#ffffff">VoiceGateway</text>
  <text x="82" y="170" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#b8c6d6">Voice AI cost transparency. Self-hosted, on your keys.</text>

  <text x="82" y="266" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#6fb4ef">LIVEKIT AGENTS · OPENAI · DEEPGRAM · ANTHROPIC · CARTESIA · ELEVENLABS</text>
</svg>
