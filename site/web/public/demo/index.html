<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg"
        />
        <title>VoiceGateway Dashboard</title>
        <script>
            // Set the theme before first paint to avoid a flash.
            (function () {
                try {
                    var t = localStorage.getItem('vg-theme');
                    if (t !== 'light' && t !== 'dark') {
                        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                    document.documentElement.dataset.theme = t;
                    var c = localStorage.getItem('vg-sidebar-collapsed') === '1';
                    document.documentElement.style.setProperty('--sidebar-width', c ? '60px' : '224px');
                } catch (e) {}
            })();
        </script>
      <script type="module" crossorigin src="/demo/assets/index-DWUBHgwq.js"></script>
      <link rel="stylesheet" crossorigin href="/demo/assets/index-CbVn9UtX.css">
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
