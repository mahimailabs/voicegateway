<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>VoiceGateway README banner source</title>
<style>
/* Reference: Langfuse README structure; VoiceGateway brand and captured console. */
:root { --canvas:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --rule:#d2d2d7; }
:root[data-theme="dark"] { --canvas:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --accent:#2997ff; --rule:#38383a; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { position:relative; width:1800px; height:580px; overflow:hidden; background:var(--canvas); border:1px solid var(--rule); padding:64px; }
.brand { width:336px; height:56px; }
h1 { margin:52px 0 22px; font-size:72px; line-height:1.03; font-weight:600; letter-spacing:-3px; }
h1 span { color:var(--accent); }
p { margin:0; font-size:27px; line-height:1.5; color:var(--muted); }
.caption { position:absolute; left:64px; bottom:48px; font-size:19px; }
.product { position:absolute; left:840px; top:64px; width:1080px; height:auto; border:1px solid var(--rule); border-radius:16px 0 0 0; }
/* GitHub repository social card: one fixed image, with both theme exports retained. */
:root[data-format="social"] main { width:1280px; height:640px; }
:root[data-format="social"] h1 { font-size:84px; margin-top:56px; margin-bottom:28px; }
:root[data-format="social"] p { font-size:30px; }
:root[data-format="social"] .product, :root[data-format="social"] .caption { display:none; }
.social-footer { display:none; }
:root[data-format="social"] .social-footer { display:flex; position:absolute; left:64px; right:64px; bottom:48px; justify-content:space-between; border-top:1px solid var(--rule); padding-top:24px; font-size:22px; color:var(--muted); }
</style>
<main aria-label="VoiceGateway: One call. The whole story. The open-source profiler for LiveKit voice agents.">
  <img class="brand" src="../dashboard/src/assets/brand/wordmark.svg" alt="VoiceGateway">
  <h1>One call.<br><span>The whole story.</span></h1>
  <p>The open-source profiler<br>for LiveKit voice agents.</p>
  <p class="caption">Console preview · Captured LiveKit data</p>
  <img class="product" src="../docs/assets/readme/call-light.jpg" alt="A real captured call with its transcript and turn inspector">
  <footer class="social-footer"><span>Open source · V1 in development</span><span>voicegateway.dev</span></footer>
</main>
<script>
const query = new URLSearchParams(location.search);
document.documentElement.dataset.format = query.get('format') === 'social' ? 'social' : 'readme';
const theme = query.get('theme') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.theme = theme;
document.querySelector('.brand').src = `../dashboard/src/assets/brand/wordmark${theme === 'dark' ? '-dark' : ''}.svg`;
document.querySelector('.product').src = `../docs/assets/readme/call-${theme}.jpg`;
</script>
</html>
