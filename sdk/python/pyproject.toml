[project]
name = "voicegateway"
version = "2.0.0"
description = "attach() for LiveKit Agents: custom call fields and live call state for VoiceGateway."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Compatible ranges, not pins, so the SDK does not break an agent's own install.
# livekit-agents 1.8.6 is the first release with the observability uploader
# (decision 0033); aiohttp and livekit-api are what it already depends on.
dependencies = [
    "aiohttp>=3.10,<4",
    "livekit-agents>=1.8.6,<2",
    "livekit-api>=1.2.0,<2",
]

[project.urls]
Homepage = "https://voicegateway.dev"
Source = "https://github.com/mahimailabs/voicegateway/tree/main/sdk/python"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "rfc3339-validator==0.1.4",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicegateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # livekit.agents.testing.fake_job_context leaves its JobContext's temporary
    # directory for the finalizer (livekit-agents 1.8.8, job.py); not ours to close.
    "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning",
]
