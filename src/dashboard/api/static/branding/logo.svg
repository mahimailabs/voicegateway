<svg viewBox="110 180 460 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoiceGateway">
  <title>VoiceGateway</title>
  <desc>Gauge meter with needle</desc>
  <!-- gauge track (unfilled range) -->
  <path d="M140 420 A200 200 0 0 1 540 420" fill="none" stroke="#E5EAEC" stroke-width="32" stroke-linecap="round"/>
  <!-- filled arc (current reading) -->
  <path d="M140 420 A200 200 0 0 1 283 198" fill="none" stroke="#1F96AA" stroke-width="32" stroke-linecap="round"/>
  <!-- soft highlight near the start -->
  <path d="M140 420 A200 200 0 0 1 220 248" fill="none" stroke="#14B8C4" stroke-width="32" stroke-linecap="round" opacity="0.35"/>
  <!-- needle -->
  <line x1="340" y1="420" x2="240" y2="210" stroke="#15788A" stroke-width="14" stroke-linecap="round"/>
  <!-- hub -->
  <circle cx="340" cy="420" r="28" fill="#1F96AA"/>
  <circle cx="340" cy="420" r="14" fill="#15788A"/>
  <!-- orbit dots -->
  <g fill="#1F96AA">
    <circle cx="160" cy="430" r="10" opacity="0.4"/>
    <circle cx="200" cy="310" r="10" opacity="0.5"/>
    <circle cx="280" cy="220" r="10" opacity="0.7"/>
    <circle cx="400" cy="210" r="10" opacity="0.8"/>
    <circle cx="490" cy="285" r="10" opacity="0.5"/>
    <circle cx="530" cy="400" r="10" opacity="0.4"/>
  </g>
</svg>
