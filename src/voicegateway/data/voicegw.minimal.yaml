# VoiceGateway minimal config (voicegw.yaml)
# A starter STT + LLM + TTS voice stack. Set the API keys via environment
# variables (e.g. DEEPGRAM_API_KEY) or paste them inline below.
#
# This is the short template. For every option (fallbacks, routing, budgets,
# auth, retention, guardrails, ...) generate the annotated reference with:
#     voicegw init --full
# Docs: https://voicegateway.mahimai.ca/docs

providers:
  deepgram:
    api_key: ${DEEPGRAM_API_KEY}
  openai:
    api_key: ${OPENAI_API_KEY}
  cartesia:
    api_key: ${CARTESIA_API_KEY}

models:
  stt:
    deepgram/nova-3:
      provider: deepgram
      model: nova-3
  llm:
    openai/gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
  tts:
    cartesia/sonic-3:
      provider: cartesia
      model: sonic-3

# Record requests to a local SQLite database so `voicegw serve` and
# `voicegw dashboard` can show your costs, sessions, and agents. The agent
# SDK's voicegateway.attach() writes to this same default path, so the
# dashboard sees your agents with no extra wiring. Without this block the
# server runs with storage off and the dashboard stays empty.
cost_tracking:
  enabled: true
  db_path: ~/.config/voicegateway/voicegw.db

projects:
  default:
    name: "My Voice Agent"
