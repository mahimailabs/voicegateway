[project]
name = "voicegateway"
dynamic = ["version"]
description = "Cost tracking and reconciliation for LiveKit voice agents: modality-aware unit accounting (audio-minutes, tokens, characters) backed by voice-prices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Mahimai Raja", email = "hello@mahimai.dev"}]
keywords = ["voice-ai", "voicegateway", "inference", "gateway", "self-hosted", "ollama", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "cryptography>=43.0",
    "voice-prices>=0.1.0,<0.2",
    "bcrypt>=4.0",
    "pillow>=10.0",
    "psutil>=5.9",
    # ORM + migration stack. Required at import time (voicegateway.models pulls
    # in SQLAlchemy/SQLModel) and at runtime for the embedded storage that
    # voicegateway.attach() writes through, so these are core, not optional:
    # a base `pip install voicegateway` must be importable.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "clickhouse-connect>=0.9,<1.0",
]

[project.optional-dependencies]
# Framework seams. The core is framework-neutral: `import voicegateway` imports
# neither livekit nor pipecat. attach()/guard() lazily import the framework by
# target type and raise a helpful error pointing at the extra. You bring your
# OWN provider plugins and local-model runtimes (livekit-plugins-*,
# faster-whisper, kokoro-onnx, piper-tts): VoiceGateway meters them by model_id
# through voice-prices and never needs the wheel installed itself, so there are
# no per-provider or local-model extras.
livekit = [
    "livekit>=1.0",
    "livekit-agents>=1.5,<1.7",
    "livekit-api>=1.0",
]
# pipecat provides the alternative agent framework attach(task)/Observer and
# guard() target. Pinned to the current PyPI floor (1.5.0); pipecat-ai uses
# git-tag dynamic versioning and requires-python >=3.11. Upper bound is the
# next major so minor releases resolve.
pipecat = ["pipecat-ai>=1.5.0,<2.0"]

# The self-host tool surface: HTTP API + web dashboard + MCP server.
# FastAPI/uvicorn serve /v1/* and the React SPA; python-multipart backs the
# logo upload; the DI/settings/logging stack backs the layered server; mcp
# powers `voicegw mcp` (manage the gateway from coding agents). SQLAlchemy 2.x
# async + SQLModel + Alembic are core (base) deps, so they are not relisted.
dashboard = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",
    "dependency-injector>=4.43",
    "pydantic-settings>=2.0",
    "asgi-correlation-id>=4.3",
    "loguru>=0.7",
    # Capped below 2.0: mcp 2.0.0 renamed Tool's ``inputSchema`` to
    # ``input_schema`` and moved the Server.list_tools/call_tool decorators,
    # which reds mypy on server/mcp/server.py. Same style as voice-prices
    # above. Lift the cap in a deliberate 2.x migration, not by resolver drift.
    "mcp>=1.2.0,<2",
]

# Self-host the shared fleet collector: the dashboard/server plus the Postgres
# backend (asyncpg, targeted by VOICEGW_DB_URL=postgresql+asyncpg://...) and the
# opt-in DuckDB read engine for columnar-fast analytics at scale. Single-node
# embedded mode still uses bundled SQLite and needs none of this.
collector = [
    "voicegateway[dashboard]",
    "asyncpg>=0.29",
    "duckdb>=1.0,<2.0",
]

# Dev. Pulls the livekit seam + the full dashboard stack (fastapi/uvicorn/DI,
# via the extra) so the server and daemon-backend/doctor tests import cleanly;
# plus duckdb + clickhouse test tooling (chdb, testcontainers)
# and the daemon-control deps (psutil, platformdirs). Real users get these via
# the extras above.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "respx>=0.21.0",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "voicegateway[livekit,dashboard]",
    "chdb>=3.0",
    "duckdb>=1.0,<2.0",
    "testcontainers[clickhouse]>=4.0",
]

[project.scripts]
voicegw = "voicegateway.cli:app"

[project.urls]
Homepage = "https://github.com/mahimailabs/voicegateway"
Documentation = "https://github.com/mahimailabs/voicegateway#readme"
Repository = "https://github.com/mahimailabs/voicegateway"
Issues = "https://github.com/mahimailabs/voicegateway/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/voicegateway/tests"]
markers = [
    "integration: marks tests that run only in the integration CI job",
]

[tool.coverage.run]
source = ["voicegateway", "dashboard"]
omit = [
    # Provider implementations require external LiveKit plugins to test
    "src/voicegateway/providers/openai_provider.py",
    "src/voicegateway/providers/deepgram_provider.py",
    "src/voicegateway/providers/anthropic_provider.py",
    "src/voicegateway/providers/cartesia_provider.py",
    "src/voicegateway/providers/elevenlabs_provider.py",
    "src/voicegateway/providers/groq_provider.py",
    "src/voicegateway/providers/assemblyai_provider.py",
    "src/voicegateway/providers/kokoro_provider.py",
    "src/voicegateway/providers/piper_provider.py",
    # Tests live inside the package directory but are excluded from the
    # wheel via [tool.hatch.build.targets.wheel] exclude below. Omit
    # from coverage too so the test code does not inflate its own
    # coverage numbers.
    "src/voicegateway/tests/*",
    # Generated or re-export shims with no behaviour worth testing.
    "src/voicegateway/_version.py",
    "src/voicegateway/cli/_app.py",
    "src/voicegateway/inference/__init__.py",
    # Auto-generated migration scripts; testing them is testing alembic.
    "alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Temporarily 78 during the beta guardrails + factory removal program: removing a
# well-tested feature dips total coverage ~1-2%. Restore to 80 (or add targeted
# tests) once the Domain A removals settle.
fail_under = 78

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/voicegateway/_version.py"

# Opt the staged dashboard bundle back in for both sdist and wheel
# targets. The path is gitignored (scripts/build_wheel.sh stages it
# only during a build), so hatchling's default VCS-aware filter would
# drop it. `artifacts` is the documented escape hatch for "build
# output that should ship even though git ignores it." Hatchling
# tolerates the path being absent (every editable install, every test
# run), so nothing breaks when the staging step has not run.
[tool.hatch.build]
artifacts = [
    "src/voicegateway/_dashboard_dist/**/*",
    "src/voicegateway/_console_dist/**/*",
    "src/voicegateway/livekit_diag/assets/*.wav",
]

# The sdist had no target section at all, so it shipped whatever hatchling's
# default VCS filter allowed: every stray screenshot at the repo root, plus the
# entire HyperFrames launch-video project. videos/ was excluded only in
# .git/info/exclude, and hatchling reads .gitignore but not that file, so 183 MB
# of local video work went out with the source distribution.
#
# An explicit include list is the fix, and it is an allowlist on purpose: a new
# stray at the root now has to be named here to ship, rather than having to be
# remembered and excluded. Everything listed is needed to build the wheel or run
# the test suite from an unpacked sdist:
#   src/         the packages themselves, plus the tests
#   alembic/     force-included into the wheel from the repo root, so a wheel
#     alembic.ini  built from an sdist without them has no migrations and
#                fails at runtime in _find_alembic_ini
#   README.md    named by project.readme, required for metadata
#   LICENSE      project.license is the SPDX string, the file still ships
#   CHANGELOG.md so an unpacked sdist can say what changed
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/alembic",
    "/alembic.ini",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
# Explicit packages list because we are on a src/ layout (PyPA convention).
# Hatchling cannot auto-detect packages outside the repo root.
packages = ["src/voicegateway", "src/dashboard"]
# Things that live inside the package directories for repo hygiene but
# must NOT ship inside the installed wheel:
#   - tests/             — test suite, large and not part of the runtime
#   - Dockerfile         — container build, not a Python file
#   - README.dockerhub.md — DockerHub-only description, irrelevant to pip users
#   - frontend/node_modules, frontend/src, frontend/*.json, tsconfig*,
#     vite.config.* — frontend build inputs; the daemon only needs dist/.
exclude = [
    "src/voicegateway/tests",
    "src/voicegateway/Dockerfile",
    "src/voicegateway/README.dockerhub.md",
    "src/dashboard/Dockerfile",
    "src/dashboard/README.dockerhub.md",
    "src/dashboard/frontend/node_modules",
    "src/dashboard/frontend/src",
    "src/dashboard/frontend/package.json",
    "src/dashboard/frontend/package-lock.json",
    "src/dashboard/frontend/tsconfig.json",
    "src/dashboard/frontend/tsconfig.node.json",
    "src/dashboard/frontend/tsconfig.tsbuildinfo",
    "src/dashboard/frontend/tsconfig.node.tsbuildinfo",
    "src/dashboard/frontend/vite.config.js",
    "src/dashboard/frontend/vite.config.ts",
    "src/dashboard/frontend/vite.config.d.ts",
    "src/dashboard/frontend/index.html",
    # Console (React 19 + Tailwind) build inputs: the daemon only needs its
    # built dist (staged into voicegateway/_console_dist), so keep the source
    # and toolchain files out of the wheel, mirroring the frontend excludes.
    "src/dashboard/console/node_modules",
    "src/dashboard/console/src",
    "src/dashboard/console/package.json",
    "src/dashboard/console/package-lock.json",
    "src/dashboard/console/tsconfig.json",
    "src/dashboard/console/vite.config.ts",
    "src/dashboard/console/index.html",
    # Keep compiled migration bytecode out of the force-included alembic tree.
    "alembic/__pycache__",
    "alembic/versions/__pycache__",
]

[tool.hatch.build.targets.wheel.force-include]
# Ship the Alembic migrations inside the installed package. alembic/ and
# alembic.ini live at the repo root (outside the src/ packages), so without
# this the wheel carries no migrations and run_migrations() fails at runtime
# with "alembic.ini not found". Placed under the package dir so that
# _find_alembic_ini (which walks up from voicegateway/core/database.py) resolves
# voicegateway/alembic.ini, whose `script_location = %(here)s/alembic` then
# points at the sibling voicegateway/alembic/ tree.
"alembic.ini" = "voicegateway/alembic.ini"
"alembic" = "voicegateway/alembic"

# Note on shipping the React bundle: the wheel published to PyPI
# carries the dashboard SPA inside the voicegateway package itself,
# at voicegateway/_dashboard_dist/. scripts/build_wheel.sh runs the
# npm build, copies dist/ into that staging path, invokes `uv build`,
# and removes the staging path on exit via trap. Hatchling picks it
# up automatically through the existing `packages = ["src/voicegateway"]`
# entry above (the pipecat-prebuilt pattern adapted to hatchling).
# Distribution paths for the frontend today:
#  - PyPI wheel: scripts/build_wheel.sh stages and ships dist/ inside
#    the wheel. The daemon's mount_frontend prefers this location.
#  - Docker: the Dockerfile's frontend-builder stage still runs npm
#    build and copies dist/ into /app/dashboard/frontend/dist; the
#    daemon's two-path resolution falls back to that location.
#  - Editable install: `cd src/dashboard/frontend && npm run build`
#    populates the same fallback path for local dev.
#  - Neither built: mount_frontend serves a "run npm run build"
#    hint JSON at / so the operator knows what to do.

[tool.pyright]
typeCheckingMode = "off"

# Ruff is the single linter + formatter (replaces flake8, isort, Black).
# Format settings are declared explicitly below so the choice (4-space
# indent, LF line endings, utf-8, trim trailing whitespace, 88-col line
# length) is visible at a glance rather than relying on Ruff defaults.

[tool.ruff]
target-version = "py311"  # project's minimum Python (pyupgrade targets this)
line-length = 88          # Black's default

[tool.ruff.format]
# Ruff defaults are correct here; declared explicitly so the choice is
# visible at a glance.
indent-style = "space"
line-ending = "lf"
quote-style = "double"          # Black-compatible
docstring-code-format = false   # leave fenced code in docstrings alone

[tool.ruff.lint]
# Selector set is the Foundry-mandated minimum (E, W, F, I, B, C4, UP)
# plus nothing else. We deliberately do NOT enable D (pydocstyle), N
# (pep8-naming), or ANN (flake8-annotations) until the codebase has a
# pass to bring them green; flipping them on now would generate hundreds
# of advisory failures with no signal.
select = [
    "E",   # pycodestyle errors          (real-bug catchers: indentation, syntax-ish)
    "W",   # pycodestyle warnings        (style nags: trailing whitespace, blank lines)
    "F",   # pyflakes                    (undefined names, unused imports, F841 unused vars)
    "I",   # isort                       (import ordering, replaces standalone isort)
    "B",   # flake8-bugbear              (likely-bug heuristics: mutable defaults, etc.)
    "C4",  # flake8-comprehensions       (cleaner list/dict/set comprehensions)
    "UP",  # pyupgrade                   (modernize syntax to target-version)
]
ignore = [
    # Line length is enforced by `ruff format`, not by the linter. Anything
    # still long after formatting (long URLs, error messages) is intentional
    # and should not nag.
    "E501",
    # FastAPI dependency injection idiom is `def f(x: T = Depends(get_x))`,
    # where the default-value function call is the whole point. Disabling
    # B008 globally avoids per-function noqa noise.
    "B008",
    # McCabe complexity is too coarse a metric: lean code may exceed the
    # threshold without being bad. We rely on review, not C901.
    "C901",
    # We use spaces, enforced by `ruff format`. W191 fires on legitimate
    # tab-indented files (e.g. Makefile fragments embedded in tests),
    # producing false positives.
    "W191",
]

# Mypy is type-checking-only (not a formatter). The mode for v0.1.x is
# "basic everywhere": run mypy across the whole `voicegateway/` package
# with a small set of useful warnings, but do NOT enable `strict = true`
# yet. The codebase passes basic-mode cleanly (110 source files, zero
# errors); flipping `strict` on would surface ~hundreds of advisory
# nags (`disallow_untyped_defs`, `disallow_any_generics`,
# `disallow_untyped_decorators`, etc.) that need a dedicated cleanup
# pass.
#
# Open Question 5 resolution (Foundry v0.1.2): basic everywhere for
# v0.1.2. A per-module strict pass (inference, server, cli first)
# is planned for v0.2.0 or v0.3.0, gated behind a Discovered Work
# entry that runs mypy --strict on one subpackage at a time and
# fixes the surfaced types.
[tool.mypy]
python_version = "3.11"           # project's minimum Python version
warn_return_any = true            # flag functions returning Any when the annotation said something else
warn_unused_configs = true        # flag dead config keys in [[tool.mypy.overrides]] sections
warn_redundant_casts = true       # flag `cast(int, x)` where x is already int (signal of stale types)
warn_unused_ignores = true        # flag `# type: ignore` comments that no longer suppress anything
no_implicit_optional = true       # require `int | None` instead of bare `int` for default=None args
ignore_missing_imports = true     # third-party SDKs (livekit, deepgram, etc.) often ship without stubs
# src/ layout: tell mypy where to find the packages when invoked without
# explicit file args. `mypy` (no args) now picks up both packages; legacy
# `mypy voicegateway dashboard` invocations need to switch to `mypy -p
# voicegateway -p dashboard` or just `mypy`.
mypy_path = ["src"]
files = ["src/voicegateway", "src/dashboard"]
# Tests inside the package directory are excluded from type checking;
# they live in src/voicegateway/tests/ but should not be part of the
# library's type contract.
exclude = ["^src/voicegateway/tests/"]

# numpy's bundled stubs use PEP 695 `type` statements that mypy rejects under
# python_version = "3.11" ("Type statement is only supported in Python 3.12 and
# greater"), which reddened the test/py3.x CI matrix on every code PR. We do not
# type-check numpy usage, so skip following into it (stubs included).
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
