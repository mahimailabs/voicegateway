default_language_version:
    python: python3

# .claude/skills/impeccable/ is a vendored third-party skill, kept byte for
# byte so `npx impeccable update` diffs cleanly. Its font index is over the
# size cap by design.
exclude: ^\.claude/skills/impeccable/

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        # 250 KiB, not the 500 KiB default. The default is why a 404 KiB
        # duplicate screenshot once reached main and stayed there. uv.lock is
        # the one tracked file allowed over it, path-anchored so a copy under
        # any other name is still caught.
        args: [--maxkb=250]
        exclude: ^uv\.lock$
    -   id: check-toml
    -   id: check-yaml
        args:
        -   --unsafe
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
    -   id: ruff
        args:
        - --fix
    -   id: ruff-format

ci:
    autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
    autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
