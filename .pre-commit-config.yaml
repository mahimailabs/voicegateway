# .claude/skills/impeccable/ is a vendored third-party skill, kept byte for
# byte so `npx impeccable update` diffs cleanly. Its font index is over the
# size cap by design.
exclude: ^\.claude/skills/impeccable/

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        # 250 KiB, not the 500 KiB default. The default is why a 404 KiB
        # duplicate screenshot once reached main and stayed there. The
        # lockfiles are the tracked files allowed over it: the dashboard's npm lock and the Python
        # SDK's uv.lock, which pins livekit-agents' whole dependency tree.
        args: [--maxkb=250]
        exclude: ^(dashboard/package-lock\.json|sdk/python/uv\.lock)$
    -   id: check-toml
    -   id: check-yaml
        args:
        -   --unsafe
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
# Go checks (CLAUDE.md Code quality). They use the tool versions pinned in go.mod, so they run only
# where Go is installed; the Go workflow runs the same checks in CI.
-   repo: local
    hooks:
    -   id: go-fmt
        name: gofumpt and goimports
        entry: go tool golangci-lint fmt --diff ./...
        language: system
        files: \.go$
        pass_filenames: false
    -   id: go-lint
        name: golangci-lint (vet, staticcheck, errcheck, gosec)
        entry: go tool golangci-lint run ./...
        language: system
        files: (\.go|^go\.mod|^\.golangci\.yml)$
        pass_filenames: false
    -   id: go-mod-tidy
        name: go mod tidy is clean
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false
# The example agent. ruff and mypy come from its own dev group in uv.lock, so
# the hooks run the pinned versions; ruff and mypy read its pyproject.toml.
-   repo: local
    hooks:
    -   id: example-uv-lock
        name: example agent uv.lock is current
        entry: uv lock --check --project examples/livekit-agent
        language: system
        files: ^examples/livekit-agent/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
    -   id: example-ruff
        name: example agent ruff
        entry: uv run --locked --project examples/livekit-agent ruff check
        language: system
        files: ^examples/livekit-agent/.*\.py$
    -   id: example-ruff-format
        name: example agent ruff format
        entry: uv run --locked --project examples/livekit-agent ruff format --check
        language: system
        files: ^examples/livekit-agent/.*\.py$
    -   id: example-mypy
        name: example agent mypy
        entry: uv run --locked --project examples/livekit-agent mypy --config-file examples/livekit-agent/pyproject.toml
        language: system
        files: ^examples/livekit-agent/.*\.py$
# The demo agent (examples/demo-calls), the same four checks from its own uv.lock.
-   repo: local
    hooks:
    -   id: demo-uv-lock
        name: demo agent uv.lock is current
        entry: uv lock --check --project examples/demo-calls
        language: system
        files: ^examples/demo-calls/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
    -   id: demo-ruff
        name: demo agent ruff
        entry: uv run --locked --project examples/demo-calls ruff check
        language: system
        files: ^examples/demo-calls/.*\.py$
    -   id: demo-ruff-format
        name: demo agent ruff format
        entry: uv run --locked --project examples/demo-calls ruff format --check
        language: system
        files: ^examples/demo-calls/.*\.py$
    -   id: demo-mypy
        name: demo agent mypy
        entry: uv run --locked --project examples/demo-calls mypy --config-file examples/demo-calls/pyproject.toml
        language: system
        files: ^examples/demo-calls/.*\.py$
# The Python SDK. Same pinned tools from its own uv.lock; mypy runs on the whole
# package from sdk/python so its strict config and the tests' imports resolve.
-   repo: local
    hooks:
    -   id: sdk-uv-lock
        name: python sdk uv.lock is current
        entry: uv lock --check --project sdk/python
        language: system
        files: ^sdk/python/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
    -   id: sdk-ruff
        name: python sdk ruff
        entry: uv run --locked --project sdk/python ruff check
        language: system
        files: ^sdk/python/.*\.pyi?$
    -   id: sdk-ruff-format
        name: python sdk ruff format
        entry: uv run --locked --project sdk/python ruff format --check
        language: system
        files: ^sdk/python/.*\.(py|pyi|md)$
    -   id: sdk-mypy
        name: python sdk mypy
        entry: bash -c 'cd sdk/python && uv run --locked mypy'
        language: system
        files: ^sdk/python/(.*\.py|pyproject\.toml)$
        pass_filenames: false

ci:
    skip: [go-fmt, go-lint, go-mod-tidy, example-uv-lock, example-ruff, example-ruff-format, example-mypy, sdk-uv-lock, sdk-ruff, sdk-ruff-format, sdk-mypy]
    autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
    autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
