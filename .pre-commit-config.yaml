default_language_version:
    python: python3

# .claude/skills/impeccable/ is a vendored third-party skill, kept byte for
# byte so `npx impeccable update` diffs cleanly. Its font index is over the
# size cap by design.
exclude: ^\.claude/skills/impeccable/

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        # 250 KiB, not the 500 KiB default. The default is why a 404 KiB
        # duplicate screenshot once reached main and stayed there. uv.lock
        # and the dashboard's npm lockfile are tracked files allowed over it.
        # The README teaser has its own 5 MiB cap below,
        # path-anchored so a copy under any other name is still caught.
        args: [--maxkb=250]
        exclude: ^(uv\.lock|dashboard/package-lock\.json|site/landing/pnpm-lock\.yaml|docs/assets/voicegateway-teaser\.gif)$
    -   id: check-added-large-files
        name: check README teaser size
        args: [--maxkb=5120]
        files: ^docs/assets/voicegateway-teaser\.gif$
    -   id: check-toml
    -   id: check-yaml
        args:
        -   --unsafe
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
    -   id: ruff
        args:
        - --fix
    -   id: ruff-format
# Go checks (CLAUDE.md Code quality). They use the tool versions pinned in go.mod, so they run only
# where Go is installed; the Go workflow runs the same checks in CI.
-   repo: local
    hooks:
    -   id: go-fmt
        name: gofumpt and goimports
        entry: go tool golangci-lint fmt --diff ./...
        language: system
        files: \.go$
        pass_filenames: false
    -   id: go-lint
        name: golangci-lint (vet, staticcheck, errcheck, gosec)
        entry: go tool golangci-lint run ./...
        language: system
        files: (\.go|^go\.mod|^\.golangci\.yml)$
        pass_filenames: false
    -   id: go-mod-tidy
        name: go mod tidy is clean
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false

ci:
    skip: [go-fmt, go-lint, go-mod-tidy]
    autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
    autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
